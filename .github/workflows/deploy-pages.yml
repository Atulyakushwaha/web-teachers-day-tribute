name: Build and deploy (gh-pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Workaround: remove package-lock to avoid optional native-binding mismatch on runner
          rm -f package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use a personal access token stored in the repo secret GH_PAGES_PAT
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./dist
